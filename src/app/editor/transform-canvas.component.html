@if (mountError(); as message) {
  <p class="mount-error">{{ message }}</p>
}
<div class="canvas-tools">
  <button
    type="button"
    class="help"
    data-testid="help-toggle"
    aria-label="Quick guide"
    title="Quick guide"
    (click)="helpRequested.emit()"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="8" cy="8" r="6.5" />
      <path d="M6.1 6.2a2 2 0 1 1 2.6 1.9c-.5.2-.7.5-.7 1v.4" />
      <circle class="fill" cx="8" cy="11.6" r="0.4" />
    </svg>
  </button>
  <button
    type="button"
    data-testid="minimap-toggle"
    [attr.aria-label]="minimapOpen() ? 'Hide minimap' : 'Show minimap'"
    [title]="minimapOpen() ? 'Hide minimap' : 'Show minimap'"
    [attr.aria-pressed]="minimapOpen()"
    [class.active]="minimapOpen()"
    (click)="toggleMinimap()"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M1.5 3.5 5.5 2l5 1.5 4-1.5v10.5l-4 1.5-5-1.5-4 1.5Z" />
      <path d="M5.5 2v10.5M10.5 3.5V14" />
    </svg>
  </button>
  <button type="button" aria-label="Reset layout" title="Reset layout" (click)="resetLayout()">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <rect x="2" y="2" width="5" height="4" />
      <rect x="9" y="2" width="5" height="7" />
      <rect x="2" y="8" width="5" height="6" />
      <rect x="9" y="11" width="5" height="3" />
    </svg>
  </button>
  <button type="button" aria-label="Reset zoom" title="Reset zoom" (click)="resetZoom()">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M3 6V3h3M13 6V3h-3M3 10v3h3M13 10v3h-3" />
    </svg>
  </button>
  <button type="button" aria-label="Reset everything" title="Reset everything" (click)="resetEverything()">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" />
      <path d="M13.5 2.5V6H10" />
    </svg>
  </button>
</div>
<div
  #host
  class="canvas-host"
  data-testid="canvas-host"
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)"
></div>
